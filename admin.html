/* QUARANTINE Z — the admin page (v6.42). The game's own palette: amber marks what is selected or about to be done, human blue what
   is given or online, zombie red what is taken away or banned. Machine values (numbers, codes, times) are set in the game's pixel
   face, Galmuri11; words people wrote (names, reasons, notices) in the system's Korean sans. */
:root{--bg:#07080c;--rail:#0f1115;--panel:#14161b;--panel2:#1b1e24;--field:#0b0d11;--line:#262a32;--line2:#363b45;--row:#1a1d22;
  --fg:#ece8dc;--dim:#9a968c;--mute:#6f6c66;--amber:#e8a33a;--amber2:#ffd890;--human:#5ab4ff;--zombie:#ff4b3a;--tape:#ffd24a;
  --c-h:#3d8ad0;--c-a:#c7832a;--grid:#23262d;
  --pix:'Galmuri11',ui-monospace,monospace;--sans:'Pretendard','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR','Segoe UI',system-ui,sans-serif;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg)}
body{font:14px/1.5 var(--sans);-webkit-text-size-adjust:100%}
a{color:var(--amber2);text-decoration:none}a:hover{text-decoration:underline}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--amber2);outline-offset:2px}
.pix{font-family:var(--pix)}
.dim{color:var(--dim)}.mute{color:var(--mute)}
.num{font-family:var(--pix);text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
code,.code{font-family:var(--pix);font-size:13px;color:var(--amber2);letter-spacing:.5px}
/* ---------- the frame: a rail on the left (a bar on top on a phone) ---------- */
.layout{display:grid;grid-template-columns:216px minmax(0,1fr);min-height:100vh}
.rail{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;background:var(--rail);border-right:1px solid var(--line)}
.brand{padding:18px 18px 14px;border-bottom:2px solid var(--amber)}
.brand .wm{font:bold 17px/1 var(--pix);letter-spacing:2px;color:#e8e4d8;text-shadow:2px 2px 0 #000}
.brand .wm b{color:var(--zombie);margin-left:6px;display:inline-block;transform:skewX(-8deg)}
.brand small{display:block;margin-top:6px;color:var(--dim);font-size:12px}
.nav{display:flex;flex-direction:column;padding:10px 0;gap:2px}
.nav a{display:flex;align-items:center;gap:10px;padding:10px 18px;color:var(--dim);font-size:14px;text-decoration:none}
.nav a svg{width:16px;height:16px;flex:none}
.nav a:hover{color:var(--fg);background:#15181d}
.nav a.on{color:#fff;background:linear-gradient(90deg,rgba(232,163,58,.15),transparent 80%);box-shadow:inset 3px 0 0 var(--amber)}
.who{margin-top:auto;padding:14px 18px;border-top:1px solid var(--line);font-size:12px;color:var(--dim);display:flex;flex-direction:column;gap:8px}
.who b{color:var(--fg);font-size:13px}.who .row{display:flex;gap:8px;flex-wrap:wrap}
main{padding:26px 30px 80px;min-width:0;max-width:1260px}
.vh{display:flex;align-items:flex-end;flex-wrap:wrap;gap:6px 16px;margin:0 0 18px}
.vh h1{margin:0;font:bold 22px/1.15 var(--pix);color:var(--amber2);text-shadow:2px 2px 0 #000}
.vh p{margin:0;color:var(--dim);font-size:13px}
.vh .sp{margin-left:auto;display:flex;gap:8px;align-items:center}
/* ---------- pieces ---------- */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:4px;min-width:0}
.panel>h2{margin:0;display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);font-size:14px;font-weight:600}
.panel>h2>span:first-child{padding-bottom:3px;border-bottom:2px solid var(--amber)}
.panel>h2 small{margin-left:auto;font-weight:400;color:var(--mute);font-size:12px}
.pb{padding:12px 14px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.stack{display:flex;flex-direction:column;gap:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:36px;padding:7px 14px;font-size:13px;font-weight:600;border-radius:3px;
  border:1px solid var(--line2);background:var(--panel2);color:var(--fg);cursor:pointer;white-space:nowrap}
.btn:hover{border-color:#4a505c;background:#22262d}
.btn:disabled{opacity:.45;cursor:default}
.btn.pri{background:var(--amber);border-color:var(--amber);color:#1a1408}.btn.pri:hover{background:#f0b04c}
.btn.pri:disabled{background:transparent;border-color:var(--line2);color:var(--mute);opacity:1}
.btn.give{border-color:rgba(90,180,255,.55);color:var(--human)}.btn.give:hover{background:rgba(90,180,255,.1)}
.btn.take{border-color:rgba(255,75,58,.55);color:#ff8a7c}.btn.take:hover{background:rgba(255,75,58,.1)}
.btn.kill{background:var(--zombie);border-color:var(--zombie);color:#fff}.btn.kill:hover{background:#ff6352}
.btn.sm{min-height:28px;padding:3px 10px;font-size:12px}
.btn.ghost{background:transparent;border-color:transparent;color:var(--dim)}.btn.ghost:hover{color:var(--fg);background:#1b1e24}
input,select,textarea{background:var(--field);border:1px solid var(--line2);border-radius:3px;padding:7px 10px;min-height:36px;color:var(--fg);min-width:0}
input:focus,select:focus,textarea:focus{border-color:var(--amber);outline:none}
textarea{resize:vertical;line-height:1.5}
input[type=number]{font-family:var(--pix);font-variant-numeric:tabular-nums}
.fld{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--dim)}
.fld>span em{font-style:normal;color:var(--mute)}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.row>.grow{flex:1 1 160px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{min-height:30px;padding:4px 11px;font-size:12px;border-radius:15px;border:1px solid var(--line2);background:transparent;color:var(--dim);cursor:pointer}
.chip:hover{color:var(--fg);border-color:#4a505c}
.chip.on{color:#1a1408;background:var(--amber);border-color:var(--amber);font-weight:600}
.tog{position:relative;display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-size:13px;color:var(--dim)}
.tog span{white-space:nowrap}
.tog input{appearance:none;-webkit-appearance:none;width:36px;height:20px;min-height:0;padding:0;border-radius:10px;background:#2a2e36;border:1px solid var(--line2);cursor:pointer;position:relative;flex:none}
.tog input::after{content:'';position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#8a8f98;transition:transform .15s}
.tog input:checked{background:rgba(232,163,58,.3);border-color:var(--amber)}.tog input:checked::after{transform:translateX(16px);background:var(--amber2)}
.tag{display:inline-block;font-size:11px;line-height:16px;padding:0 6px;border-radius:2px;border:1px solid var(--line2);color:var(--dim);white-space:nowrap;vertical-align:middle}
.tag.adm{color:var(--amber2);border-color:#7a6430}
.tag.ban{color:#fff;background:var(--zombie);border-color:var(--zombie)}
.tag.live{color:#06121e;background:var(--human);border-color:var(--human)}
.tag.set{color:var(--tape);border-color:rgba(255,210,74,.45)}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#3a3e46;vertical-align:middle;flex:none}
.dot.on{background:var(--human);box-shadow:0 0 0 3px rgba(90,180,255,.18)}
.empty{padding:26px 14px;text-align:center;color:var(--mute);font-size:13px}
.err{padding:14px;color:#ff9a8a;font-size:13px}
.loading{opacity:.55;transition:opacity .2s}
/* ---------- tables ---------- */
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;font-weight:500;color:var(--mute);font-size:12px;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl th.num{text-align:right}
.tbl td{padding:8px 10px;border-bottom:1px solid #1c1f25;vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tr.click{cursor:pointer}.tbl tr.click:hover td{background:var(--row)}
.tbl tr.sel td{background:#1d2027}
.tbl .nick{display:flex;align-items:center;gap:7px;min-width:0}.tbl .nick b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:180px}
.tbl input[type=number]{width:110px;text-align:right}
.tbl td.act{text-align:right;white-space:nowrap}
.more{display:flex;align-items:center;gap:12px;justify-content:space-between;padding:10px 14px;border-top:1px solid var(--line);font-size:12px;color:var(--mute)}
/* ---------- the dashboard: the scoreboard the game's HUD shows, then the day so far ---------- */
.top{display:flex;align-items:center;flex-wrap:wrap;gap:18px 28px;margin-bottom:18px}
.hud{display:flex;align-items:flex-start;gap:4px;padding:10px 12px 8px;background:rgba(8,10,14,.85);border:1px solid var(--line2);border-radius:4px}
.hud>div{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:92px}
.hud b{font:bold 33px/1 var(--pix);padding:7px 14px 6px;min-width:76px;text-align:center}
.hud .h b{color:var(--human);background:rgba(90,180,255,.08);border:1px solid rgba(90,180,255,.4)}
.hud .z b{color:var(--zombie);background:rgba(255,75,58,.08);border:1px solid rgba(255,75,58,.4)}
.hud .c b{color:#fff;padding-left:18px;padding-right:18px}
.hud span{font-size:12px;color:var(--dim)}.hud .h span{color:#8cc8ff}.hud .z span{color:#ff9a8a}
.kpis{display:flex;flex-wrap:wrap;gap:0}
.kpis>div{display:flex;flex-direction:column;gap:3px;padding:2px 22px;border-left:1px solid var(--line)}
.kpis>div:first-child{border-left:0;padding-left:0}
.kpis span{font-size:12px;color:var(--dim)}.kpis b{font:bold 22px/1.2 var(--pix);color:#fff}.kpis small{font-size:12px;color:var(--mute)}
.chart{padding:10px 12px 6px}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart .ax{font:11px var(--pix);fill:var(--mute)}
.chart .gl{stroke:var(--grid);stroke-width:1}
.chart .bar{cursor:default}.chart .hit:hover+.bar,.chart .hit:focus+.bar{filter:brightness(1.25)}
.chart .hit{fill:transparent}.chart .hit:focus{outline:none}
.chart .lbl{font:11px var(--pix);fill:var(--fg)}
.ctip{position:fixed;z-index:80;pointer-events:none;background:#20232a;border:1px solid var(--line2);border-radius:3px;padding:6px 9px;font-size:12px;color:var(--dim);box-shadow:0 6px 18px rgba(0,0,0,.5)}
.ctip b{display:block;font:bold 13px var(--pix);color:#fff}
.ctab{width:100%;border-collapse:collapse;font-size:12px}.ctab td,.ctab th{padding:4px 8px;border-bottom:1px solid #1c1f25;text-align:right}.ctab th:first-child,.ctab td:first-child{text-align:left}
.kv{display:grid;grid-template-columns:auto 1fr;gap:7px 16px;font-size:13px}
.kv>span{color:var(--dim)}.kv>b{font-weight:500;min-width:0;overflow-wrap:anywhere}
.kv .num{text-align:left}
/* ---------- players ---------- */
.search{display:flex;gap:8px;margin-bottom:12px}.search input{flex:1;min-width:0}
.bar2{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.sheetWrap{position:fixed;inset:0;z-index:50;display:flex;justify-content:flex-end;background:rgba(0,0,0,.5)}
.sheet:focus{outline:none}
.sheet{width:min(640px,100%);height:100%;overflow-y:auto;background:var(--rail);border-left:1px solid var(--line2);box-shadow:-24px 0 60px rgba(0,0,0,.55);animation:sheetIn .18s ease-out}
@keyframes sheetIn{from{transform:translateX(24px);opacity:.4}to{transform:none;opacity:1}}
.sh{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:10px;padding:14px 18px;background:var(--rail);border-bottom:2px solid var(--amber)}
.sh h2{margin:0;font-size:18px;font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sh .x{margin-left:auto}
.sb{padding:16px 18px;display:flex;flex-direction:column;gap:18px}
.sec>h3{margin:0 0 10px;font-size:13px;font-weight:600;color:var(--fg);display:flex;align-items:center;gap:8px}
.sec>h3 small{font-weight:400;color:var(--mute)}
.wallet{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:4px;overflow:hidden}
.wallet>div{background:var(--panel);padding:9px 10px;display:flex;flex-direction:column;gap:2px;min-width:0}
.wallet span{font-size:11px;color:var(--dim)}.wallet b{font:bold 15px/1.3 var(--pix);color:#fff;overflow:hidden;text-overflow:ellipsis}
.box{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:12px}
.box.danger{border-color:#4a2622;background:linear-gradient(rgba(255,75,58,.05),rgba(255,75,58,.02));box-shadow:inset 3px 0 0 var(--zombie)}
.box .note{font-size:12px;color:var(--mute);margin:8px 0 0}
.guns{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.gun{display:inline-flex;align-items:center;gap:6px;padding:3px 4px 3px 9px;font-size:12px;border:1px solid var(--line2);border-radius:3px;background:var(--panel2)}
.gun button{min-height:22px;padding:0 6px;font-size:11px;border:0;background:transparent;color:#ff8a7c;cursor:pointer;border-radius:2px}.gun button:hover{background:rgba(255,75,58,.12)}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:8px;overflow-x:auto}
.tabs button{border:0;background:transparent;color:var(--dim);padding:8px 12px;font-size:13px;cursor:pointer;white-space:nowrap;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button.on{color:#fff;border-bottom-color:var(--amber)}
.days{display:flex;align-items:flex-end;gap:3px;height:56px;margin-top:8px}
.days i{flex:1;background:var(--c-h);border-radius:2px 2px 0 0;min-height:1px}
.days i.z{background:#2a2e36}
.sub{display:flex;gap:4px;margin:0 0 14px;flex-wrap:wrap}
/* ---------- settings ---------- */
.cfg{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px 14px}
.cfg .wide{grid-column:1/-1}
.cfg .fld.chg>span{color:var(--tape)}
.cfg .fld.chg input,.cfg .fld.chg textarea{border-color:rgba(255,210,74,.55)}
.lines{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:4px;margin-top:6px;font-size:12px;color:var(--dim)}
.lines span::before{content:'';display:inline-block;width:6px;height:6px;margin-right:6px;border-radius:1px;background:var(--line2);vertical-align:middle}

.savebar{position:sticky;bottom:0;z-index:5;display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:14px;padding:10px 14px;background:#191b20;border:1px solid var(--line2);border-radius:4px;box-shadow:0 -8px 24px rgba(0,0,0,.4)}

.nitem .a{grid-column:2;grid-row:1/3;display:flex;gap:4px;align-items:center}

.gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.gate .card{width:min(380px,100%);background:var(--panel);border:1px solid var(--line2);border-top:2px solid var(--amber);border-radius:4px;padding:24px;display:flex;flex-direction:column;gap:14px}

.gate p{margin:0;color:var(--dim);font-size:13px}
.gate .btn{width:100%}
.gate pre{margin:0;padding:10px;background:var(--field);border:1px solid var(--line);border-radius:3px;font-size:11px;white-space:pre-wrap;word-break:break-all;color:var(--amber2)}
.toast{position:fixed;left:50%;bottom:24px;z-index:90;transform:translateX(-50%);max-width:min(560px,calc(100% - 32px));padding:10px 16px;border-radius:4px;background:#22262d;border:1px solid var(--line2);box-shadow:0 10px 30px rgba(0,0,0,.5);font-size:13px}
.toast.ok{border-color:rgba(90,180,255,.55)}.toast.bad{border-color:rgba(255,75,58,.6);color:#ffb3a8}
.ask{position:fixed;inset:0;z-index:85;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:16px}
.ask .card{width:min(420px,100%);background:var(--panel);border:1px solid var(--line2);border-radius:4px;padding:18px;display:flex;flex-direction:column;gap:12px}
.ask h3{margin:0;font-size:16px}.ask p{margin:0;color:var(--dim);font-size:13px;white-space:pre-wrap}
.ask .eff{padding:10px 12px;background:var(--field);border:1px solid var(--line);border-radius:3px;font-family:var(--pix);font-size:13px}
.ask .row{justify-content:flex-end}

  .who{margin:0 0 0 auto;padding:6px 10px;border:0;flex-direction:row;align-items:center}.who .me{display:none}

  .sheet{width:100%;border-left:0}

  if(l.action==='grant'){a=d.amount<0?'회수':'지급';x=`${KIND[d.kind]||d.kind} ${d.amount>0?'+':'−'}${N(Math.abs(d.amount))} (${N(d.old)} → ${N(d.new)})`}
  else if(l.action==='gun_give'||l.action==='gun_take')x=GN(d.gun);
  else if(l.action==='rename')x=`${d.old} → ${d.new}`;
  else if(l.action==='ban')x=d.days?d.days+'일':'영구';
  else if(l.action==='price'||l.action==='price_reset')x=`${GN(d.gun)} ${N(d.old&&d.old.price)}${d.old&&!d.old.sold?' (안 팖)':''} → ${N(d.new&&d.new.price)}${d.new&&!d.new.sold?' (안 팖)':''}`;
  else if(l.action==='config')x=Object.keys(d).map(k=>`${CFGL(k)}: ${short(d[k].old)} → ${short(d[k].new)}`).join(', ');
  else if(l.action==='mission')x=d.id+(d.old?'':' (새로 추가)');
  else if(/^notice_/.test(l.action))x=d.title||'';
  return `<b style="font-weight:600">${esc(a)}</b>${x?` <span class="dim">${esc(x)}</span>`:''}`}
async function vLogs(target){const M=$('main'),G=ST.logs;if(G.target!==target){G.rows=[];G.done=false;G.target=target}
  M.innerHTML=head('기록','관리자가 한 일이 전부 남아요. 지우거나 고칠 수 없어요.',target?'<a class="btn sm" href="#/logs">전체 보기</a>':'')+`<div class="panel" id="logB"><div class="empty">불러오는 중…</div></div>`;
  G.rows=[];G.done=false;await loadLogs()}
async function loadLogs(){const G=ST.logs;if(G.busy)return;G.busy=true;try{const before=G.rows.length?G.rows[G.rows.length-1].id:0;const r=await API.rpc('qz_admin_logs',{p_target:G.target,p_before:before,p_limit:100});
    G.rows=G.rows.concat(r||[]);G.done=!r||r.length<100;renderLogs()}catch(e){if($('logB'))$('logB').innerHTML=errBox(e,'relogs')}finally{G.busy=false}}
function renderLogs(){const B=$('logB'),G=ST.logs;if(!B)return;if(!G.rows.length){B.innerHTML='<div class="empty">아직 기록이 없어요.</div>';return}
  const who=G.target&&G.rows[0]?G.rows[0].target_name:null;
  B.innerHTML=`${G.target?`<h2><span>${esc(who||'이 플레이어')}에게 한 일</span></h2>`:''}<div class="tw"><table class="tbl"><thead><tr><th>시각</th><th>관리자</th><th>대상</th><th>작업</th><th class="hm">사유</th></tr></thead><tbody>
    ${G.rows.map(l=>`<tr><td class="mute" style="white-space:nowrap">${esc(dt(l.at))}</td><td style="white-space:nowrap">${esc(l.by||'-')}</td><td style="white-space:nowrap">${l.target?`<a href="#/players/${esc(l.target)}">${esc(l.target_name||'(지워진 계정)')}</a>`:'<span class="mute">게임 설정</span>'}</td><td>${logWhat(l)}</td><td class="hm">${esc(l.reason||'')}</td></tr>`).join('')}
    </tbody></table></div><div class="more"><span>${N(G.rows.length)}개</span>${G.done?'':'<button class="btn sm" data-a="morelogs">더 보기</button>'}</div>`}

// ---------- what the buttons do ----------
const curVal=(u,k)=>+(({coins:u.coins,frags:u.frags,tfrags:u.tfrags,tickets:u.tickets,season_tickets:u.season_tickets})[k]||0);
async function onSubmit(f,k,sub){
  if(k==='login'){const em=f.email.value.trim(),pw=f.pw.value;if(!em||!pw){toast('이메일과 비밀번호를 적어 주세요','bad');return}
    await busy(f,async()=>{try{await API.signIn(em,pw);await enter()}catch(e){gate('login',errText(e))}});return}
  if(k==='search'){ST.users.q=f.q.value.trim();ST.users.loaded=false;await loadUsers(false);return}
  const u=ST.user,why=f.reason?f.reason.value.trim():'';
  if(['grant','gungive','rename','ban','unban'].includes(k)&&!why){toast('사유를 적어 주세요','bad');f.reason.focus();return}
  if(k==='grant'){const kind=f.kind.value,amt=Math.abs(parseInt(f.amount.value,10)||0),sg=sub&&sub.value==='-1'?-1:1;if(!amt){toast('수량을 적어 주세요','bad');f.amount.focus();return}
    const cur=curVal(u,kind),nv=Math.max(0,cur+sg*amt);
    if((sg<0||amt>=(kind==='coins'?100000:1000))&&!await ask({title:`${KIND[kind]} ${sg<0?'회수':'지급'}`,eff:`${N(cur)} → ${N(nv)} (${sg<0?'−':'+'}${N(Math.abs(nv-cur))})`,body:`${u.nickname}\n사유: ${why}`,ok:sg<0?'회수하기':'지급하기',danger:sg<0}))return;
    await busy(f,async()=>{try{const r=await API.rpc('qz_admin_grant',{p_id:u.id,p_kind:kind,p_amount:sg*amt,p_reason:why});toast(`${KIND[kind]} ${sg<0?'회수':'지급'}: ${N(r.old)} → ${N(r.new)}`,'ok');f.reset();await reloadUser()}catch(e){toast(errText(e),'bad')}});return}
  if(k==='gungive'){const g=f.gun.value;if(!g)return;await busy(f,async()=>{try{await API.rpc('qz_admin_gun',{p_id:u.id,p_gun:g,p_give:true,p_reason:why});toast(`${GN(g)} 지급했어요`,'ok');await reloadUser()}catch(e){toast(errText(e),'bad')}});return}
  if(k==='rename'){const nn=f.nick.value.trim();if(nn.length<2){toast('닉네임은 2~16자로 적어 주세요','bad');f.nick.focus();return}
    await busy(f,async()=>{try{const r=await API.rpc('qz_admin_rename',{p_id:u.id,p_nick:nn,p_reason:why});toast(`닉네임을 바꿨어요: ${r.old} → ${r.new}`,'ok');await reloadUser()}catch(e){toast(errText(e),'bad')}});return}
  if(k==='ban'){const d=parseInt(f.days.value,10)||0;
    if(!await ask({title:'이용 정지',eff:d?`${d}일 (${dt(Date.now()+d*864e5)}까지)`:'영구 정지',body:`${u.nickname}\n사유: ${why}\n\n정지 중에는 보상, 상점, 해독기, 공개 방, 친구, 메시지가 막혀요.`,ok:'정지하기',danger:true}))return;
    await busy(f,async()=>{try{await API.rpc('qz_admin_ban',{p_id:u.id,p_days:d,p_reason:why});toast(`${u.nickname} 이용 정지 (${d?d+'일':'영구'})`,'ok');await reloadUser()}catch(e){toast(errText(e),'bad')}});return}
  if(k==='unban'){await busy(f,async()=>{try{await API.rpc('qz_admin_unban',{p_id:u.id,p_reason:why});toast(`${u.nickname} 정지를 풀었어요`,'ok');await reloadUser()}catch(e){toast(errText(e),'bad')}});return}
  if(k==='cfgsave'){const ch={};for(const [key,v] of Object.entries(ST.cfgDraft)){const C=ST.cfg[key];
      if(Array.isArray(C))ch[key]=(Array.isArray(v)?v:String(v).split('\n')).map(s=>String(s).trim()).filter(Boolean);
      else if(typeof C==='object'&&C!==null){try{ch[key]=JSON.parse(v)}catch(e){toast(`${CFGL(key)}: JSON 꼴이 아니에요`,'bad');return}}
      else{if(v===''||!isFinite(v)){toast(`${CFGL(key)}: 숫자를 적어 주세요`,'bad');return}ch[key]=v}}
    for(const key of ['season_lines','side_lines'])if(ch[key]){const bad=ch[key].find(s=>!/^(gun:[a-z0-9_]+|coins:[0-9]+|frags:[0-9]+|tickets:[0-9]+)$/.test(s));if(bad){toast(`${CFGL(key)}: 「${bad}」 — gun:무기ID · coins:숫자 · frags:숫자 · tickets:숫자 중 하나로 적어 주세요`,'bad');return}
      if(ch[key].length<12){toast(`${CFGL(key)}: 12줄 이상이어야 해요 (지금 ${ch[key].length}줄)`,'bad');return}}
    await busy(f,async()=>{try{ST.cfg=await API.rpc('qz_admin_config',{p_values:ch,p_reason:f.reason.value.trim()});ST.cfgDraft={};renderCfg();toast(`설정 ${Object.keys(ch).length}개를 저장했어요`,'ok')}catch(e){toast(errText(e),'bad')}});return}
  if(k==='nsave'){const n=ST.nEdit||{},row={id:n.id||null,title:f.title.value.trim(),body:f.body.value,level:f.level.value,popup:f.popup.checked,active:f.active.checked,starts_at:fromLocal(f.starts_at.value),ends_at:fromLocal(f.ends_at.value)};
    if(!row.title){toast('제목을 적어 주세요','bad');f.title.focus();return}
    await busy(f,async()=>{try{ST.notices=await API.rpc('qz_admin_notice_save',{p_row:row});toast(n.id?'공지를 고쳤어요':'공지를 올렸어요','ok');ST.nEdit=null;renderNEdit();renderNList()}catch(e){toast(errText(e),'bad')}});return}}
async function onClick(t,a,v,e){
  switch(a){
  case 'logout':await API.signOut();ST.me=null;location.hash='#/dash';gate('login');return;
  case 'recheck':await enter();return;
  case 'oauth':API.oauth(v);return;
  case 'dash':vDash(true);return;
  case 'ctab':{const c=$(v);if(!c)return;const tb=c.querySelector('.tw'),svg=c.querySelector('svg'),on=tb.hidden;tb.hidden=!on;svg.style.display=on?'none':'';t.textContent=on?'차트로 보기':'표로 보기';t.setAttribute('aria-pressed',on);return}
  case 'user':location.hash='#/players/'+v;return;
  case 'sort':ST.users.sort=v;ST.users.loaded=false;document.querySelectorAll('[data-a="sort"]').forEach(b=>{b.classList.toggle('on',b.dataset.v===v);b.setAttribute('aria-pressed',b.dataset.v===v)});await loadUsers(false);return;
  case 'moreusers':await busy(t.parentNode,()=>loadUsers(true));return;
  case 'reusers':await loadUsers(false);return;
  case 'closesheet':closeSheet();return;
  case 'copy':try{await navigator.clipboard.writeText(v);toast('복사했어요','ok')}catch(x){toast(v)}return;
  case 'utab':ST.utab=v;document.querySelectorAll('[data-a="utab"]').forEach(b=>{b.classList.toggle('on',b.dataset.v===v);b.setAttribute('aria-selected',b.dataset.v===v)});if($('ulog'))$('ulog').innerHTML=ulogHtml(ST.user);return;
  case 'bandays':{const f=t.closest('form');f.days.value=v;f.querySelectorAll('[data-a="bandays"]').forEach(b=>{b.classList.toggle('on',b===t);b.setAttribute('aria-checked',b===t)});return}
  case 'guntake':{const u=ST.user,f=t.closest('.box'),r=f&&f.querySelector('input[name=reason]'),why=r?r.value.trim():'';
    if(!why){toast('아래 칸에 사유를 먼저 적어 주세요','bad');if(r)r.focus();return}
    if(!await ask({title:'무기 회수',eff:GN(v),body:`${u.nickname}\n사유: ${why}`,ok:'회수하기',danger:true}))return;
    try{await API.rpc('qz_admin_gun',{p_id:u.id,p_gun:v,p_give:false,p_reason:why});toast(`${GN(v)} 회수했어요`,'ok');await reloadUser()}catch(x){toast(errText(x),'bad')}return}
  case 'pf':ST.pf=v;renderPrices();return;
  case 'psave':{const g=v,tr=t.closest('tr'),pr=tr.querySelector('[data-pp]'),sd=tr.querySelector('[data-ps]'),p=(ST.prices||[]).find(x=>x.gun===g);const price=parseInt(pr.value,10);
    if(!(price>=0)){toast('가격을 숫자로 적어 주세요','bad');pr.focus();return}
    await busy(tr,async()=>{try{await API.rpc('qz_admin_price',{p_gun:g,p_price:price,p_sold:sd?sd.checked:p.sold,p_reason:''});ST.prices=await API.rpc('qz_admin_prices');renderPrices();toast(`${GN(g)}: ${N(price)} 코인${sd&&!sd.checked?' (안 팖)':''}`,'ok')}catch(x){toast(errText(x),'bad')}});return}
  case 'preset':{if(!await ask({title:'가격 되돌리기',eff:GN(v),body:'schema.sql에 적힌 가격과 판매 여부로 돌려놔요.',ok:'되돌리기'}))return;
    try{const r=await API.rpc('qz_admin_price_reset',{p_gun:v});ST.prices=await API.rpc('qz_admin_prices');renderPrices();toast(`${GN(v)}: ${N(r.price)} 코인으로 되돌렸어요`,'ok')}catch(x){toast(errText(x),'bad')}return}
  case 'cfgundo':ST.cfgDraft={};renderCfg();return;
  case 'resettings':vSettings(parse().a||'prices');return;
  case 'mnew':{ST.mNew=true;renderMissions();const ni=document.querySelector('tr[data-new] input[name=id]');if(ni)ni.focus();return}
  case 'mcancel':ST.mNew=false;renderMissions();return;
  case 'msave':{const tr=t.closest('tr'),q=n=>tr.querySelector(`[name="${n}"]`),isNew=!!tr.dataset.new,id=isNew?q('id').value.trim():tr.dataset.mid;
    if(isNew&&!/^[a-z0-9_]{1,24}$/.test(id)){toast('미션 ID는 영문 소문자 · 숫자 · _ 로 1~24자','bad');q('id').focus();return}
    if(isNew&&(ST.missions||[]).some(m=>m.id===id)){toast('이미 있는 ID예요','bad');return}
    const row={id,tier:+q('tier').value,kind:q('kind').value,goal:parseInt(q('goal').value,10),coins:parseInt(q('coins').value,10)||0,tickets:parseInt(q('tickets').value,10)||0,weight:parseInt(q('weight').value,10),active:q('active').checked,ko:q('ko').value.trim()};
    if(!(row.goal>=1)){toast('목표는 1 이상이어야 해요','bad');q('goal').focus();return}if(!(row.weight>=0))row.weight=1;
    await busy(tr,async()=>{try{ST.missions=await API.rpc('qz_admin_mission_save',{p_row:row,p_reason:''});ST.mNew=false;renderMissions();toast(`미션 ${id} ${isNew?'추가했어요':'저장했어요'}`,'ok')}catch(x){toast(errText(x),'bad')}});return}
  case 'nlv':{const f=t.closest('form');f.level.value=v;ST.nLevel=v;if(ST.nEdit)ST.nEdit.level=v;f.querySelectorAll('[data-a="nlv"]').forEach(b=>{b.classList.toggle('on',b===t);b.setAttribute('aria-checked',b===t)});nPreview(f);return}
  case 'nnew':ST.nEdit=null;renderNEdit();renderNList();return;
  case 'nedit':{const n=(ST.notices||[]).find(x=>String(x.id)===String(v));if(!n)return;ST.nEdit={...n};renderNEdit();renderNList();const ed=$('nEd');if(ed)ed.scrollIntoView({block:'start',behavior:'smooth'});return}
  case 'ntog':{const n=(ST.notices||[]).find(x=>String(x.id)===String(v));if(!n)return;try{ST.notices=await API.rpc('qz_admin_notice_save',{p_row:{...n,active:!n.active}});toast(n.active?'공지를 껐어요':'공지를 켰어요','ok');renderNList()}catch(x){toast(errText(x),'bad')}return}
  case 'ndel':{const n=(ST.notices||[]).find(x=>String(x.id)===String(v));if(!n)return;if(!await ask({title:'공지 삭제',eff:n.title,body:'지우면 되돌릴 수 없어요. 잠깐 내리기만 하려면 「끄기」를 쓰세요.',ok:'삭제하기',danger:true}))return;
    try{ST.notices=await API.rpc('qz_admin_notice_delete',{p_id:n.id});if(ST.nEdit&&ST.nEdit.id===n.id){ST.nEdit=null;renderNEdit()}renderNList();toast('공지를 지웠어요','ok')}catch(x){toast(errText(x),'bad')}return}
  case 'renotices':vNotices();return;
  case 'morelogs':await loadLogs();return;
  case 'relogs':vLogs(ST.logs.target);return}}
function nPreview(f){const p=$('pvBan');if(!p)return;const lv=f.level.value;p.className='pvBan lv-'+lv;p.innerHTML=`<em>${NLV[lv]}</em><b>${esc(f.title.value||'제목')}</b><span>${esc((f.body.value.split('\n').find(s=>s.trim()))||'')}</span>`}

// ---------- wiring ----------
document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(!t)return;if(t.tagName==='A'&&t.getAttribute('href'))return;
  if(t.dataset.a==='sheetbg'){if(e.target===t)closeSheet();return}// (a click anywhere inside the sheet reaches the backdrop's handler: only the backdrop itself closes it)
  e.preventDefault();onClick(t,t.dataset.a,t.dataset.v,e).catch(x=>toast(errText(x),'bad'))});
document.addEventListener('submit',e=>{const f=e.target.closest('form[data-f]');if(!f)return;e.preventDefault();onSubmit(f,f.dataset.f,e.submitter).catch(x=>toast(errText(x),'bad'))});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!document.querySelector('.ask')&&$('over')&&$('over').firstChild){closeSheet();return}
  if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('tr.click')){e.preventDefault();e.target.click()}});
document.addEventListener('input',e=>{const t=e.target;
  if(t.id==='pq'){ST.pq=t.value;const pos=t.selectionStart;renderPrices();const n=$('pq');if(n){n.focus();try{n.setSelectionRange(pos,pos)}catch(x){}}return}
  if(t.dataset.pp||t.dataset.ps){const tr=t.closest('tr'),b=tr&&tr.querySelector('[data-a="psave"]'),p=(ST.prices||[]).find(x=>x.gun===(t.dataset.pp||t.dataset.ps));if(!b||!p)return;
    const pr=tr.querySelector('[data-pp]'),sd=tr.querySelector('[data-ps]');b.disabled=(+pr.value===p.price)&&(!sd||sd.checked===p.sold);if(t.dataset.ps){const s=t.parentNode.querySelector('span');if(s)s.textContent=t.checked?'판매':'안 팖'}return}
  if(t.dataset.ck){const k=t.dataset.ck,C=ST.cfg[k];let v;if(t.type==='checkbox')v=t.checked;else if(t.dataset.kind==='lines')v=t.value.split('\n');else if(t.dataset.kind==='json')v=t.value;else v=t.value===''?'':+t.value;
    const same=t.type==='checkbox'?v===C:t.dataset.kind==='lines'?JSON.stringify(v.map(s=>s.trim()).filter(Boolean))===JSON.stringify(C):t.dataset.kind==='json'?v.replace(/\s/g,'')===JSON.stringify(C).replace(/\s/g,''):v===C;
    if(same)delete ST.cfgDraft[k];else ST.cfgDraft[k]=v;
    if(t.type==='checkbox'||t.dataset.kind==='lines'){const pos=t.selectionStart;renderCfg();const n=document.querySelector(`[data-ck="${k}"]`);if(n&&t.type!=='checkbox'){n.focus();try{n.setSelectionRange(pos,pos)}catch(x){}}}
    else{const l=t.closest('label.fld');if(l)l.classList.toggle('chg',!same);const sb=document.querySelector('.savebar');if(sb){const n=Object.keys(ST.cfgDraft).length;sb.querySelector('span').innerHTML=n?`<b style="color:var(--tape)">${n}개 바뀜</b>`:'<span class="mute">바뀐 값 없음</span>';sb.querySelectorAll('input,button').forEach(x=>x.disabled=!n)}}
    return}
  if(t.form&&t.form.dataset.f==='nsave'&&(t.name==='title'||t.name==='body'))nPreview(t.form)});
document.addEventListener('change',e=>{const t=e.target;if(t.dataset&&(t.dataset.ps||t.dataset.ck)&&t.type==='checkbox')t.dispatchEvent(new Event('input',{bubbles:true}))});
document.addEventListener('pointerover',e=>{const h=e.target.closest&&e.target.closest('.chart .hit');if(h)chartTip(h,true)});
document.addEventListener('pointerout',e=>{const h=e.target.closest&&e.target.closest('.chart .hit');if(h)chartTip(h,false)});
document.addEventListener('focusin',e=>{if(e.target.matches&&e.target.matches('.chart .hit'))chartTip(e.target,true)});
document.addEventListener('focusout',e=>{if(e.target.matches&&e.target.matches('.chart .hit'))chartTip(e.target,false)});
addEventListener('hashchange',()=>{if(ST.me)route()});
// a sign-in coming back from Google / Kakao: the tokens arrive in the address's hash
(function(){const hs=location.hash||'';let msg='';
  if(/access_token=|error=/.test(hs)){const q=new URLSearchParams(hs.replace(/^#/,''));if(q.get('error'))msg=q.get('error_description')||q.get('error');
    else API.save({access_token:q.get('access_token'),refresh_token:q.get('refresh_token'),expires_at:+q.get('expires_at')||0,expires_in:q.get('expires_in')});
    try{history.replaceState(null,'',location.pathname+'#/dash')}catch(e){}}
  if(msg){gate('login',msg);return}enter()})();
