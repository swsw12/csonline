<script>
(function(){var q=new URLSearchParams(location.search).get('lang'),L=q==='en'||q==='ko'?q:(String(navigator.language||'').toLowerCase().indexOf('ko')===0?'ko':'en');
  function set(l){L=l;document.documentElement.lang=l;var A=document.querySelectorAll('article[lang]'),i,x;for(i=0;i<A.length;i++)A[i].hidden=A[i].getAttribute('lang')!==l;
    x=document.querySelectorAll('[data-l]');for(i=0;i<x.length;i++)x[i].setAttribute('aria-pressed',String(x[i].getAttribute('data-l')===l));
    x=document.querySelectorAll('[data-ko]');for(i=0;i<x.length;i++)x[i].textContent=x[i].getAttribute(l==='ko'?'data-ko':'data-en');
    x=document.querySelectorAll('a[data-keep]');for(i=0;i<x.length;i++)x[i].setAttribute('href',x[i].getAttribute('href').split('?')[0]+'?lang='+l);
    var h=document.querySelector('article[lang="'+l+'"] h1');if(h)document.title=h.textContent+' · QUARANTINE Z'}
  document.addEventListener('click',function(e){var b=e.target.closest&&e.target.closest('[data-l]');if(!b)return;set(b.getAttribute('data-l'));try{history.replaceState(null,'','?lang='+L+location.hash)}catch(x){}});
  set(L)})();
</script>
